<text class="tm" x="24.0" y="368.0" font-size="11" font-weight="400" text-anchor="start">Durumu 512’de sıfırlamak kesintisizle aynı (1,9×10⁻⁸ bit); bağımsız 512’likler pencere 512 ile aynı (≤ 0,002).</text>
